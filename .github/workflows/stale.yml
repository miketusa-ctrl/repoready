---
# RepoReady by Harlo (formerly Digital Promo Hub) - Mark/close stale issues and PRs
name: Stale
"on":
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
          stale-issue-message: "This issue has had no activity for 60 days and will close in 14 days unless updated."
          stale-pr-message: "This PR has had no activity for 60 days and will close in 14 days unless updated."
