---
# RepoReady by Harlo (formerly Digital Promo Hub) - Python test matrix
name: CI Python
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
      - name: Test (pytest, unittest fallback)
        run: |
          python -m pip install pytest
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1 || ls ./*/test_*.py >/dev/null 2>&1; then
            python -m pytest -q
          elif python -m unittest discover -v; then
            true
          else
            echo "No Python tests found; skipping."
          fi
